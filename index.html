<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joining Server...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .btn {
            background-color: #00b06f; /* Roblox Green */
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 20px 2px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            font-weight: bold;
        }
        .btn:hover { background-color: #00915b; }
        .debug { color: #888; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🚀 Launching Roblox...</h1>
    <p>We are putting you in the server.</p>
    
    <a id="launch-btn" class="btn" href="#">Click here to Join</a>

    <p class="debug" id="status">Waiting for data...</p>

    <script>
        // 1. Grab IDs from the URL
        const params = new URLSearchParams(window.location.search);
        const placeId = params.get('placeId');
        const jobId = params.get('jobId');
        const statusText = document.getElementById("status");
        const launchBtn = document.getElementById("launch-btn");

        if (placeId && jobId) {
            // 2. Create the deep link
            const robloxUrl = `roblox://experiences/start?placeId=${placeId}&gameInstanceId=${jobId}`;
            
            statusText.innerText = `Target: ${placeId} / ${jobId}`;
            
            // 3. Set the button link (Manual Backup)
            launchBtn.href = robloxUrl;

            // 4. Attempt Auto-Launch
            setTimeout(() => {
                window.location.href = robloxUrl;
            }, 1000); // Wait 1 second to let page load first
            
        } else {
            statusText.innerText = "Error: No Game ID found in URL.";
            launchBtn.style.display = "none";
            document.body.innerHTML += "<p>Go back to Discord and try again.</p>";
        }
    </script>
</body>
</html>
